spring:
  datasource:
    url: jdbc:h2:mem:jira_ai_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-secret-key-for-jwt-signing-must-be-at-least-32-bytes-long
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
