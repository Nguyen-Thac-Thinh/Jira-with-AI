name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra-check:
    name: Infrastructure & Config Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  backend-ci:
    name: Backend (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if backend is initialized
        id: check
        run: |
          if [ -f "backend/pom.xml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Backend not initialized yet (backend/pom.xml not found). Skipping."
          fi

      - name: Set up JDK 21
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test backend
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: mvn -B verify

  frontend-ci:
    name: Frontend (React / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if frontend is initialized
        id: check
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Frontend not initialized yet (frontend/package.json not found). Skipping."
          fi

      - name: Set up Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint frontend (if configured)
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build frontend
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

  ai-service-ci:
    name: AI Service (Python / scikit-learn / Monte Carlo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if AI service is initialized
        id: check
        run: |
          if [ -f "ai-service/requirements.txt" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "AI service not initialized yet (ai-service/requirements.txt not found). Skipping."
          fi

      - name: Set up Python 3.12
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Syntax check
        if: steps.check.outputs.exists == 'true'
        working-directory: ai-service
        run: python -m compileall -q .

      - name: Run tests (if present)
        if: steps.check.outputs.exists == 'true'
        working-directory: ai-service
        run: |
          if [ -d "tests" ]; then
            pytest -v
          else
            echo "No tests/ directory found yet. Skipping pytest."
          fi
